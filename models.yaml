# Model registry — one place mapping model ALIASES to providers and prices.
# Absent or empty = everything uses the SWARM_* env vars (current behavior).
#
# Five-year seam: run different roles on different providers SIMULTANEOUSLY
# (orchestrator on a frontier API, router on free local, juniors on Groq)
# by referencing aliases in manifests/org.yaml (model: fast, model: brain).
#
# api_key values use "env:VAR_NAME" — never put real keys in this file.
# price_in / price_out = USD per 1M tokens; enables dollar-cost accounting
# in --status and the dashboard.

default:
  price_in: 0        # set for your SWARM_MODEL to get $ tracking
  price_out: 0

aliases: {}
