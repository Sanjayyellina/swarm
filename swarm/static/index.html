<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swarm — Control Room</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#121722; --panel2:#0e1420; --line:#1f2937;
    --text:#e2e8f0; --dim:#64748b; --accent:#f59e0b; --accent2:#38bdf8;
    --good:#34d399; --bad:#f87171; --mono:'SF Mono',ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,'Segoe UI',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel2)}
  header .logo{font-weight:800;letter-spacing:.14em;color:var(--accent);font-size:15px}
  header .client{color:var(--dim);font-size:13px}
  header .stats{margin-left:auto;display:flex;gap:18px;font-family:var(--mono);font-size:12px;color:var(--dim)}
  header .stats b{color:var(--text)}
  main{flex:1;display:grid;grid-template-columns:290px 1fr 360px;min-height:0}
  .col{border-right:1px solid var(--line);overflow-y:auto;background:var(--panel)}
  .col:last-child{border-right:none;background:var(--panel2)}
  h2{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);padding:12px 14px 6px;position:sticky;top:0;background:inherit}
  .card{margin:4px 10px;padding:8px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;font-size:12.5px}
  .col:last-child .card{background:var(--panel)}
  .card .t{color:var(--dim);font-family:var(--mono);font-size:10.5px}
  .card.approval{border-color:#7c2d12;background:#1a120b}
  .card.approval .t{color:var(--accent)}
  .empty{color:var(--dim);font-size:12px;padding:4px 16px 10px;font-style:italic}
  /* chat */
  .chat{display:flex;flex-direction:column;min-height:0;background:var(--bg)}
  .msgs{flex:1;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:10px}
  .m{max-width:76%;padding:9px 13px;border-radius:12px;white-space:pre-wrap;font-size:13.5px}
  .m.you{align-self:flex-end;background:#1d4ed8;border-bottom-right-radius:3px}
  .m.swarm{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:3px}
  .m .tier{display:inline-block;margin-top:6px;font-family:var(--mono);font-size:10px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
  .tier.direct{color:var(--good);border-color:#14532d}
  .tier.team{color:var(--accent2);border-color:#0c4a6e}
  .tier.company{color:var(--accent);border-color:#7c2d12}
  .inputbar{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--line);background:var(--panel2)}
  .inputbar input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:11px 14px;font-size:14px;outline:none}
  .inputbar input:focus{border-color:var(--accent)}
  .inputbar button{background:var(--accent);color:#0b0e14;font-weight:700;border:0;border-radius:10px;padding:0 20px;cursor:pointer;font-size:14px}
  .inputbar button:disabled{opacity:.5}
  /* feed */
  .ev{padding:6px 14px;border-bottom:1px solid #151b28;font-family:var(--mono);font-size:11px;color:var(--dim)}
  .ev .actor{color:var(--accent2)}
  .ev .tool{color:var(--text)}
  .ev.route .tool{color:var(--accent)}
  .ev.assign .tool{color:var(--good)}
  ::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
</style>
</head>
<body>
<header>
  <span class="logo">◤ SWARM</span>
  <span class="client" id="client">connecting…</span>
  <div class="stats">
    <span>model <b id="model">–</b></span>
    <span>turns <b id="turns">0</b></span>
    <span>events <b id="evcount">0</b></span>
  </div>
</header>
<main>
  <div class="col" id="ops">
    <h2>⚠ Approvals</h2><div id="approvals"></div>
    <h2>Appointments</h2><div id="appts"></div>
    <h2>Messages</h2><div id="messages"></div>
    <h2>Scheduled Jobs</h2><div id="jobs"></div>
  </div>
  <div class="chat">
    <div class="msgs" id="msgs"></div>
    <div class="inputbar">
      <input id="box" placeholder="Talk to the swarm — it sizes itself to the request…" autocomplete="off">
      <button id="send">Send</button>
    </div>
  </div>
  <div class="col"><h2>Audit Trail — live</h2><div id="feed"></div></div>
</main>
<script>
const $=id=>document.getElementById(id);
let TOKEN=localStorage.getItem('swarm_token')||'';
const H=()=>TOKEN?{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN}:{'Content-Type':'application/json'};
const SESSION=localStorage.getItem('swarm_session')||('ui-'+Math.random().toString(36).slice(2,8));
localStorage.setItem('swarm_session',SESSION);

async function api(path,opts){
  const r=await fetch(path,opts);
  if(r.status===401){
    TOKEN=prompt('Server token (SWARM_SERVER_TOKEN):')||'';
    localStorage.setItem('swarm_token',TOKEN);
    return api(path,{...opts,headers:H()});
  }
  return r.json();
}
function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}
function ts(t){return new Date(t*1000).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}
function cards(el,rows,fn,emptyMsg){
  el.innerHTML=rows.length?rows.map(fn).join(''):`<div class="empty">${emptyMsg}</div>`;
}

async function refresh(){
  try{
    const s=await api('/api/state',{headers:H()});
    $('client').textContent=s.client; $('model').textContent=s.model;
    $('turns').textContent=s.llm_turns; $('evcount').textContent=s.event_count;
    cards($('approvals'),s.approvals,x=>`<div class="card approval"><div class="t">${ts(x.created)}</div>${esc(x.body)}</div>`,'none pending');
    cards($('appts'),s.appointments,x=>`<div class="card"><b>${esc(x.start)}</b> — ${esc(x.name)}<div class="t">${esc(x.phone)} · ${esc(x.service)}</div></div>`,'none booked');
    cards($('messages'),s.messages,x=>`<div class="card"><div class="t">${ts(x.created)} · ${esc(x.name)} ${esc(x.phone)}</div>${esc(x.body)}</div>`,'inbox clear');
    cards($('jobs'),s.jobs,x=>`<div class="card"><div class="t">#${x.id} · ${x.status} · runs ${ts(x.run_at)}</div>${esc(x.task)}</div>`,'nothing scheduled');
    const e=await api('/api/events',{headers:H()});
    $('feed').innerHTML=e.events.map(x=>{
      const cls=x.tool==='route'?'route':(x.tool==='assign'?'assign':'');
      return `<div class="ev ${cls}"><span class="actor">${esc(x.actor)}</span> → <span class="tool">${esc(x.tool)}</span> ${esc((x.args||'').slice(0,70))}<br>&nbsp;&nbsp;↳ ${esc((x.result||'').slice(0,90))}</div>`;
    }).join('');
  }catch(err){ $('client').textContent='server offline?'; }
}

function bubble(cls,text,tier){
  const d=document.createElement('div'); d.className='m '+cls;
  d.textContent=text;
  if(tier){const b=document.createElement('span');b.className='tier '+tier;b.textContent=tier;d.appendChild(document.createElement('br'));d.appendChild(b);}
  $('msgs').appendChild(d); $('msgs').scrollTop=$('msgs').scrollHeight;
}

async function send(){
  const v=$('box').value.trim(); if(!v)return;
  $('box').value=''; $('send').disabled=true; bubble('you',v);
  try{
    const r=await api('/handle',{method:'POST',headers:H(),body:JSON.stringify({message:v,session:SESSION})});
    let tier=null;
    if(r.route){const m=r.route.match(/'tier': '(\w+)'/); if(m)tier=m[1];}
    bubble('swarm',r.reply||r.error||'(no reply)',tier);
  }catch(e){ bubble('swarm','⚠ '+e.message); }
  $('send').disabled=false; $('box').focus(); refresh();
}
$('send').onclick=send;
$('box').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
refresh(); setInterval(refresh,4000);
</script>
</body>
</html>
